<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Screen Capture</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="glass-wrap">

    <div class="tabs">
      <button class="tab active" data-tab="screenshot">📷 Screenshot</button>
      <button class="tab" data-tab="record">🎥 Record</button>
    </div>

    <div id="panel-screenshot" class="panel active">
      <div class="grid-3">
        <button id="btn-visible" class="card">
          <span class="ico">🖥️</span>
          <span class="lbl">Visible Part</span>
        </button>
        <button id="btn-fullpage" class="card">
          <span class="ico">📄</span>
          <span class="lbl">Full Page</span>
        </button>
        <button id="btn-region" class="card">
          <span class="ico">✂️</span>
          <span class="lbl">Selected Area</span>
        </button>
      </div>

      <div class="list">
        <button id="btn-delay" class="row">⏱️ Visible Part after Delay</button>
        <button id="btn-desktop-shot" class="row">🖥️ Entire Screen</button>
      </div>

      <p class="note">Saved to Downloads • No account needed</p>
    </div>

    <div id="panel-record" class="panel">
      <div class="grid-2">
        <button class="card rec-mode selected" data-mode="monitor">
          <span class="ico">🖥️</span>
          <span class="lbl">Desktop</span>
        </button>
        <button class="card rec-mode" data-mode="browser">
          <span class="ico">🌐</span>
          <span class="lbl">This Tab</span>
        </button>
        <button class="card rec-mode" data-mode="window">
          <span class="ico">🗔</span>
          <span class="lbl">Window</span>
        </button>
        <button class="card disabled" disabled>
          <span class="ico">📷</span>
          <span class="lbl">Camera</span>
        </button>
      </div>

      <div class="toggles">
        <label><input type="checkbox" id="toggle-mic" checked> 🎤 Mic</label>
        <label><input type="checkbox" id="toggle-system-audio" checked> 🔊 System</label>
      </div>

      <div class="quality">
        <select id="quality-select">
          <option value="1080" selected>1080p</option>
          <option value="720">720p</option>
          <option value="1440">1440p</option>
        </select>
        <span class="badge">WebM</span>
      </div>

      <button id="btn-start-record" class="start-btn">● Start Recording</button>
      <p class="note">Recording starts immediately • No extra window</p>
    </div>

  </div>
  <script src="popup.js"></script>
</body>
</html>
