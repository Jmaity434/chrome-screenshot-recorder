<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Screen Capture</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">

    <!-- Tabs -->
    <div class="tabs">
      <button class="tab active" data-tab="screenshot">
        <span class="tab-icon">📷</span> Screenshot
      </button>
      <button class="tab" data-tab="record">
        <span class="tab-icon">🎥</span> Record
      </button>
    </div>

    <!-- ========== SCREENSHOT PANEL ========== -->
    <div id="panel-screenshot" class="panel active">

      <div class="option-grid">
        <button class="option-card" id="btn-visible">
          <div class="option-icon">🖥️</div>
          <div class="option-label">Visible Part</div>
        </button>

        <button class="option-card" id="btn-fullpage">
          <div class="option-icon">📄</div>
          <div class="option-label">Full Page</div>
        </button>

        <button class="option-card" id="btn-region">
          <div class="option-icon">✂️</div>
          <div class="option-label">Selected Area</div>
        </button>
      </div>

      <div class="option-list">
        <button class="option-row" id="btn-delay">
          <span class="row-icon">⏱️</span>
          <span>Visible Part after Delay</span>
        </button>

        <button class="option-row" id="btn-desktop-shot">
          <span class="row-icon">🖥️</span>
          <span>Entire Screen</span>
        </button>
      </div>

      <div class="footer-note">
        Saved to Downloads • No account needed
      </div>
    </div>

    <!-- ========== RECORD PANEL ========== -->
    <div id="panel-record" class="panel">

      <div class="option-grid">
        <button class="option-card selected" id="rec-desktop" data-mode="monitor">
          <div class="option-icon">🖥️</div>
          <div class="option-label">Desktop</div>
        </button>

        <button class="option-card" id="rec-tab" data-mode="browser">
          <div class="option-icon">🌐</div>
          <div class="option-label">This Tab</div>
        </button>

        <button class="option-card" id="rec-window" data-mode="window">
          <div class="option-icon">🗔</div>
          <div class="option-label">Window</div>
        </button>

        <button class="option-card disabled" id="rec-camera" title="Coming soon">
          <div class="option-icon">📷</div>
          <div class="option-label">Camera</div>
        </button>
      </div>

      <div class="controls-row">
        <label class="toggle">
          <input type="checkbox" id="toggle-mic" checked>
          <span class="toggle-label">🎤 Mic</span>
        </label>
        <label class="toggle">
          <input type="checkbox" id="toggle-system-audio" checked>
          <span class="toggle-label">🔊 System</span>
        </label>
      </div>

      <div class="quality-row">
        <select id="quality-select">
          <option value="1080" selected>1080p</option>
          <option value="720">720p</option>
          <option value="1440">1440p</option>
        </select>
        <span class="format-badge">WebM</span>
      </div>

      <button id="btn-start-record" class="start-btn">
        ● Start Recording
      </button>

      <div class="footer-note">
        Recording continues even if you switch tabs
      </div>
    </div>

  </div>
  <script src="popup.js"></script>
</body>
</html>
