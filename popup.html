<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>1080p Screenshot & Recorder</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Screen Capture</h1>
      <p class="subtitle">1080p • No account needed</p>
    </header>

    <div class="section">
      <h2>Screenshot</h2>
      <button id="btn-screenshot" class="btn primary">
        <span class="icon">📷</span>
        Capture Visible Tab
      </button>
      <p class="hint">Captures the current tab at high quality</p>
    </div>

    <div class="section">
      <h2>Screen Recording</h2>
      <button id="btn-start-record" class="btn primary">
        <span class="icon">🎥</span>
        Start Recording
      </button>
      <button id="btn-stop-record" class="btn danger" disabled>
        <span class="icon">⏹</span>
        Stop Recording
      </button>
      <p class="hint">Records at 1080p. Choose tab, window or entire screen.</p>
      <div id="recording-status" class="status hidden">
        <span class="dot"></span> Recording… <span id="timer">00:00</span>
      </div>
    </div>

    <footer>
      <p>Works offline • Instant download</p>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
