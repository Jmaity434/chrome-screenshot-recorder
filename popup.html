<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>1080p Screenshot & Recorder</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Screen Capture</h1>
      <p class="subtitle">1080p • No account needed</p>
    </header>

    <div class="section">
      <h2>Screenshot</h2>
      <button id="btn-visible" class="btn primary">
        <span class="icon">📷</span>
        Visible Area
      </button>
      <button id="btn-fullpage" class="btn secondary">
        <span class="icon">📄</span>
        Full Page
      </button>
      <button id="btn-region" class="btn secondary">
        <span class="icon">✂️</span>
        Select Area
      </button>
      <p class="hint">Visible Area = what you see now<br>Full Page = entire scrollable page<br>Select Area = draw a box</p>
    </div>

    <div class="section">
      <h2>Screen Recording</h2>
      <button id="btn-start-record" class="btn primary">
        <span class="icon">🎥</span>
        Start Recording
      </button>
      <p class="hint">A small window will open. You can freely switch tabs and work while recording continues.</p>
    </div>

    <footer>
      <p>Works offline • Instant download</p>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
