<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Recording…</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f0f0f;
      color: #f5f5f5;
      width: 260px;
      padding: 16px;
      user-select: none;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
    }
    .dot {
      width: 10px;
      height: 10px;
      background: #ff4d4d;
      border-radius: 50%;
      animation: pulse 1.2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    h1 {
      font-size: 14px;
      font-weight: 600;
    }
    #timer {
      font-size: 28px;
      font-weight: 600;
      text-align: center;
      letter-spacing: 1px;
      margin: 12px 0 16px;
      color: #fff;
    }
    .btn {
      width: 100%;
      padding: 11px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      background: #2a2a2a;
      color: #ff6b6b;
      border: 1px solid #3a3a3a;
    }
    .btn:hover {
      background: #3a2020;
      border-color: #ff6b6b;
    }
    .hint {
      font-size: 11px;
      color: #777;
      text-align: center;
      margin-top: 10px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="dot"></div>
    <h1>Recording in progress</h1>
  </div>
  <div id="timer">00:00</div>
  <button id="btn-stop" class="btn">⏹ Stop & Save</button>
  <p class="hint">You can freely switch tabs and work.<br>This small window will stay open.</p>
  <script src="recorder.js"></script>
</body>
</html>
