<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Recording…</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
      background: #0a0a0b;
      color: #f5f5f7;
      width: 290px;
      padding: 12px;
      user-select: none;
    }

    .glass {
      padding: 22px 20px 18px;
      border-radius: 20px;
      background: linear-gradient(
        165deg,
        rgba(40, 40, 45, 0.85) 0%,
        rgba(22, 22, 26, 0.9) 100%
      );
      backdrop-filter: blur(40px) saturate(200%);
      -webkit-backdrop-filter: blur(40px) saturate(200%);
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow:
        0 12px 40px rgba(0, 0, 0, 0.55),
        inset 0 1px 1px rgba(255, 255, 255, 0.12),
        inset 0 -1px 1px rgba(0, 0, 0, 0.25);
      position: relative;
      overflow: hidden;
    }

    .glass::before {
      content: '';
      position: absolute;
      top: 0;
      left: 12%;
      right: 12%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.5), transparent);
      pointer-events: none;
    }

    .glass::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 20px;
      background: radial-gradient(ellipse 80% 50% at 50% -20%, rgba(255,255,255,0.08), transparent 60%);
      pointer-events: none;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      position: relative;
      z-index: 2;
    }

    .dot {
      width: 10px;
      height: 10px;
      background: #ff4d4d;
      border-radius: 50%;
      box-shadow: 0 0 12px rgba(255, 77, 77, 0.7);
      animation: pulse 1.3s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(0.82); }
    }

    h1 {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: -0.2px;
      color: #fff;
    }

    #timer {
      font-size: 34px;
      font-weight: 600;
      text-align: center;
      letter-spacing: 2px;
      margin: 16px 0 20px;
      color: #ffffff;
      text-shadow: 0 2px 10px rgba(0,0,0,0.35);
      position: relative;
      z-index: 2;
    }

    .btn {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      background: rgba(255, 70, 70, 0.12);
      color: #ff6b6b;
      border: 1px solid rgba(255, 100, 100, 0.28);
      transition: all 0.25s ease;
      position: relative;
      z-index: 2;
    }

    .btn:hover {
      background: rgba(255, 70, 70, 0.22);
      border-color: rgba(255, 100, 100, 0.5);
      box-shadow: 0 4px 18px rgba(255, 70, 70, 0.22);
      transform: translateY(-1px);
    }

    .hint {
      font-size: 11.5px;
      color: rgba(255, 255, 255, 0.38);
      text-align: center;
      margin-top: 14px;
      line-height: 1.5;
      position: relative;
      z-index: 2;
    }
  </style>
</head>
<body>
  <div class="glass">
    <div class="header">
      <div class="dot"></div>
      <h1>Recording in progress</h1>
    </div>
    <div id="timer">00:00</div>
    <button id="btn-stop" class="btn">⏹ Stop & Save</button>
    <p class="hint">You can freely switch tabs and work.<br>This window stays open.</p>
  </div>
  <script src="recorder.js"></script>
</body>
</html>
